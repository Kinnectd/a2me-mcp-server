name: Security Scan

# Free scanning (gitleaks, Semgrep OSS, OSV-Scanner, Trivy) via the shared workflow in kinnectd-workflows.
# Report-only for now (enforce: false): findings appear in the job summary and run artifacts, nothing blocks.
on:
  pull_request:
  schedule:
    - cron: "40 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    uses: Kinnectd/kinnectd-workflows/.github/workflows/security-scan.yml@main
    with:
      enforce: false
